<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Open Sourcerers of the git mountain</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="brand">

        <p class="eyebrow">
          OPEN SOURCERERS
        </p>

        <h1>
          of the git mountain
        </h1>

        <p class="subtitle">
          Private workspace for the people building together.
        </p>

      </div>


      <form
        id="login-form"
        class="login-form"
      >

        <label for="email">
          E-Mail
        </label>

        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="deine@email.de"
          required
        >


        <label for="password">
          Passwort
        </label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••"
          required
        >


        <button type="submit">
          Einloggen
        </button>


        <p
          id="login-message"
          class="message"
          role="alert"
          aria-live="polite"
        ></p>

      </form>


      <p class="closed-access">
        Closed Access · Accounts werden ausschließlich
        von einem Administrator erstellt.
      </p>

    </section>

  </main>


  <script
    type="module"
    src="js/auth.js"
  ></script>

</body>
</html>
